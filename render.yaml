# Render.com blueprint - free web service (no credit card needed).
# Deploy: push this repo to GitHub, then "New +" -> "Blueprint" on render.com.
#
# Free-tier notes (Free = 512 MB RAM, <1 CPU):
# - A loaded worker measures ~53 MB, so two workers plus request buffers stay
#   comfortably inside the memory budget. Threads are 2 (not 4) to leave headroom
#   for a photo upload being processed in memory.
# - The web filesystem is EPHEMERAL. Hosted data therefore uses external
#   PostgreSQL plus S3-compatible object storage.
# - Instances sleep when idle and cold-start slowly, so the health check points
#   at the cheap /health/ endpoint rather than the full dashboard.
# - `migrate` is NOT run at build time on purpose: the build container has its
#   own throwaway disk, so migrating there is wasted work. It runs on start,
#   against the live instance disk.
services:
  - type: web
    name: ai-smart-wardrobe-os
    runtime: python
    plan: free
    # Render's default build command for Python is `pip install -r requirements.txt`.
    # Specifying buildCommand REPLACES that default, so the install has to be
    # included here explicitly - otherwise nothing is installed and the app dies
    # on start with ModuleNotFoundError. The `|| true` keeps a collectstatic
    # hiccup from failing the build outright; gunicorn then serves and the log
    # shows the real error instead of a bare "deploy failed".
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt && (python manage.py collectstatic --noinput || echo "collectstatic failed - see log above")
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      # Fully qualified version - Render requires a patch number here. Keep this
      # in step with the matching patch listed at https://www.python.org/downloads/
      # and with .python-version, which is what local dev and CI read.
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Leading dot = this host and every subdomain of it, which covers the
      # generated <service>.onrender.com name.
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # HTTPS is terminated at Render's proxy. DEBUG=False already implies these,
      # but they are explicit so the intent survives a future DEBUG flip.
      - key: FORCE_HTTPS
        value: "True"
      # Required for POST requests (login, uploads, forms) behind the proxy.
      # If you rename the service, change this to your new hostname.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ai-smart-wardrobe-os.onrender.com"
      # Only trust X-Forwarded-For from Render's proxy, for correct rate limiting.
      - key: TRUST_PROXY_HEADERS
        value: "True"
      - key: LOGIN_REQUIRED
        value: "True"
      - key: ACCOUNT_EMAIL_VERIFICATION
        value: "optional"
      # Durable production database and object storage. Set these in Render.
      - key: DATABASE_URL
        sync: false
      - key: USE_OBJECT_STORAGE
        value: "True"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: LOG_LEVEL
        value: "INFO"
      # Account verification and password reset require a real SMTP provider.
      # Add these secret values in the Render dashboard; never commit credentials.
      # Brevo provides a free SMTP relay tier (300 emails/day). Add the SMTP
      # login/key and a verified sender in the Render dashboard; never commit them.
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DEFAULT_CITY
        value: "Bengaluru"
      - key: DEFAULT_LATITUDE
        value: "12.9716"
      - key: DEFAULT_LONGITUDE
        value: "77.5946"
      # Uploads: stay under Render's request-body limit and the app's own caps.
      - key: DATA_UPLOAD_MAX_MEMORY_SIZE
        value: "12582912"
      # Optional Google Sign-In (set these in the Render dashboard):
      # - key: GOOGLE_OAUTH_CLIENT_ID
      #   sync: false
      # - key: GOOGLE_OAUTH_CLIENT_SECRET
      #   sync: false
      # Optional AI provider keys (free tiers, all optional):
      # - key: GROQ_API_KEY
      #   sync: false
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: OPENROUTER_API_KEY
      #   sync: false
      # - key: HUGGINGFACE_API_KEY
      #   sync: false
