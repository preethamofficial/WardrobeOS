services:
  web:
    build: .
    ports: ["8000:8000"]
    # Live-reload the source tree. The image installs dependencies into the
    # system Python, so shadowing /app does not hide the installed packages.
    volumes: [".:/app"]
    # .env stays out of the image; docker compose reads it from disk instead.
    env_file:
      - .env
    environment:
      # Local development only. A real SECRET_KEY comes from .env / the platform.
      DEBUG: "True"
      SECRET_KEY: "local-development-secret-not-for-production"
      ALLOWED_HOSTS: "127.0.0.1,localhost"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
